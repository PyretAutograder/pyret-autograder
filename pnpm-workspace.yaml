packages:
  - pkgs/*

catalog:
  '@swc/cli': ^0.7.8
  '@swc/core': ^1.13.21
  '@types/node': ^24.1.0
  pyret-lang: npm:@ironm00n/pyret-lang@0.0.6
  pyret-npm: npm:@ironm00n/pyret-npm@0.0.4
  yaml: ^2.8.1

catalogs:
  # NOTE(owen): be very careful to keep these in sync with pyret-lang/package.json
  # this can lead to some incredibly nasty bugs otherwise.
  pyret-runtime:
    ascii-table: ^0.0.9
    canvas: ^3.1.0
    cross-fetch: ^4.1.0
    error-stack-parser: ^2.1.4
    fast-csv: ^5.0.2
    js-md5: ^0.8.3
    js-sha256: ^0.5.0
    q: ~1.0.1
    resolve: ^1.22.10
    s-expression: ~2.2.0
    seedrandom: ~2.3.10
    source-map: ^0.5.7
    vega: ^6.1.2

# NOTE: these revert pnpm11 default config changes
verifyDepsBeforeRun: false
# skips postinstall scripts if installed initially with `--ignore-scrips` --
# which we rely on since that's what nixpkgs' `pnpmConfigHook` uses
optimisticRepeatInstall: false

allowBuilds:
  '@ironm00n/pyret-lang': true
  '@swc/core': true
  bufferutil: true
  canvas: true
  es5-ext: false # protestware
  utf-8-validate: true
