name: Publish Docker Images

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Republish even if the tag already exists"
        type: boolean
        default: false
  push:
    branches: [master]
    paths:
      - nix/sources.json
      - pkgs/gradescope/package.json

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image references
        id: images
        run: |
          for image in gradescope-build gradescope-run; do
            name=$(nix eval --raw ".#$image-docker.imageName")
            tag=$(nix eval --raw ".#$image-docker.imageTag")
            echo "$image=docker.io/$name:$tag" >> "$GITHUB_OUTPUT"
          done

      - name: Log in to Docker Hub
        run: skopeo login docker.io -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin <<< "${{ secrets.DOCKERHUB_TOKEN }}"

      - name: Refuse to overwrite published tags
        if: ${{ !inputs.force }}
        env:
          BUILD_REF: ${{ steps.images.outputs.gradescope-build }}
          RUN_REF: ${{ steps.images.outputs.gradescope-run }}
        run: |
          for ref in "$BUILD_REF" "$RUN_REF"; do
            if skopeo inspect "docker://$ref" > /dev/null 2>&1; then
              echo "::error::$ref is already published; bump \"version\" in pkgs/gradescope/package.json"
              exit 1
            fi
          done

      - name: Publish Gradescope Build Docker
        env:
          REF: ${{ steps.images.outputs.gradescope-build }}
        run: |
          "$(nix build .#gradescope-build-docker --print-out-paths)" | skopeo copy docker-archive:/dev/stdin "docker://$REF"

      - name: Publish Gradescope Run Docker
        env:
          REF: ${{ steps.images.outputs.gradescope-run }}
        run: |
          "$(nix build .#gradescope-run-docker --print-out-paths)" | skopeo copy docker-archive:/dev/stdin "docker://$REF"
